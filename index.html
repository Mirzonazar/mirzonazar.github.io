<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirzonazar — Exclusive Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="cursor"></div>
<div class="cursor-follower"></div>

<header class="navbar">
  <div class="container flex-nav">
    <div class="logo magnetic">Mirzonazar</div>
    <nav class="nav">
      <a href="#home">Bosh</a>
      <a href="#work">Loyihalar</a>
      <a href="#contact">Aloqa</a>
    </nav>
    <div class="theme-toggle">
      <input type="checkbox" id="theme-switch">
      <label for="theme-switch" class="toggle">
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>
</header>

<section id="home" class="hero">
  <div class="hero-content">
    <h1 class="reveal">Sifat <span>&</span> Estetika</h1>
    <p class="reveal delay">Brendingiz uchun yuqori darajadagi raqamli tajribalar yaratamiz.</p>
    <a href="#contact" class="btn reveal delay-2 magnetic">Loyiha boshlash</a>
  </div>
</section>

<section id="work" class="section">
  <div class="container">
    <h2 class="section-title reveal">Loyihalarimiz</h2>
    <div class="portfolio-grid">
      <div class="card reveal magnetic">
        <div class="card-info">
          <span>01</span>
          <h3>Luxury Estate</h3>
          <p>Branding & UI</p>
        </div>
      </div>
      <div class="card reveal delay magnetic">
        <div class="card-info">
          <span>02</span>
          <h3>Elite Fashion</h3>
          <p>E-commerce</p>
        </div>
      </div>
      <div class="card reveal delay-2 magnetic">
        <div class="card-info">
          <span>03</span>
          <h3>Fintech App</h3>
          <p>Digital System</p>
        </div>
      </div>
    </div>
  </div>
</section>

<section id="contact" class="section">
  <div class="container">
    <div class="form-container reveal">
      <h2 class="section-title">Bog'laning</h2>
      <form class="form">
        <div class="input-row">
          <input type="text" placeholder="Ismingiz" required>
          <input type="email" placeholder="Emailingiz" required>
        </div>
        <textarea placeholder="Loyihangiz haqida..." rows="5"></textarea>
        <button type="submit" class="btn magnetic">Yuborish</button>
      </form>
    </div>
  </div>
</section>

<footer class="footer">
  <p>© 2026 Mirzonazar. Made with Precision.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
